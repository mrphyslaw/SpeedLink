name: Release retention

on:
  release:
    types: [published]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview older releases without deleting them
        type: boolean
        default: true
  push:
    paths:
      - .github/workflows/release-retention.yml
      - .github/scripts/release-retention*.mjs
  pull_request:
    paths:
      - .github/workflows/release-retention.yml
      - .github/scripts/release-retention*.mjs

permissions:
  contents: read

jobs:
  tests:
    name: Retention tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --test .github/scripts/release-retention.test.mjs

  cleanup:
    name: Keep five published releases
    needs: tests
    if: github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-retention
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check the cleanup code from the default branch
        run: node --test .github/scripts/release-retention.test.mjs
      - name: Retain the five newest published releases
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node .github/scripts/release-retention.mjs
